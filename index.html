<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MyChat</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
}

button{
    border:0;
    cursor:pointer;
}

.header{
    height:60px;
    background:#128C7E;
    color:white;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:22px;
    font-weight:bold;
}

.login{
    width:min(400px,92%);
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 3px 15px #0002;
    text-align:center;
}

.login input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

.primary{
    background:#128C7E;
    color:white;
    padding:11px 17px;
    border-radius:8px;
    margin:5px;
}

.secondary{
    background:#eee;
    color:#333;
    padding:11px 17px;
    border-radius:8px;
}

#status{
    min-height:20px;
}

.app{
    display:none;
    height:calc(100vh - 60px);
}

.sidebar{
    width:330px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    height:65px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
}

.new-chat{
    background:#128C7E;
    color:white;
    border-radius:8px;
    padding:9px 12px;
}

.chat-list{
    flex:1;
    overflow-y:auto;
}

.empty{
    text-align:center;
    color:#777;
    padding:35px 15px;
}

.chat-item{
    display:flex;
    align-items:center;
    padding:12px;
    border-bottom:1px solid #eee;
}

.chat-item:hover{
    background:#f5f5f5;
}

.chat-info{
    flex:1;
    cursor:pointer;
}

.chat-name{
    font-weight:bold;
}

.online{
    color:#16a34a;
    font-size:12px;
}

.offline{
    color:#999;
    font-size:12px;
}

.chat-delete{
    background:#dc3545;
    color:white;
    border-radius:7px;
    padding:7px 9px;
}

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:65px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.back{
    display:none;
    background:none;
    font-size:27px;
    color:#128C7E;
    margin-right:10px;
}

.current-name{
    font-weight:bold;
}

.typing{
    color:#128C7E;
    font-size:12px;
    margin-left:10px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    position:relative;
    max-width:70%;
    background:white;
    padding:9px 12px;
    margin:7px 0;
    border-radius:10px;
    box-shadow:0 1px 2px #0001;
    word-break:break-word;
}

.mine{
    margin-left:auto;
    background:#dcf8c6;
}

.message-text{
    white-space:pre-wrap;
}

.message-time{
    font-size:10px;
    color:#777;
    text-align:right;
    margin-top:5px;
}

.message-status{
    font-size:11px;
    text-align:right;
    color:#777;
}

.seen{
    color:#128C7E;
}

.message-menu{
    display:flex;
    gap:5px;
    margin-top:7px;
    justify-content:flex-end;
}

.message-menu button{
    font-size:11px;
    padding:5px 7px;
    border-radius:5px;
    background:#eee;
}

.message-menu .danger{
    background:#dc3545;
    color:white;
}

.composer{
    background:white;
    padding:9px;
    display:flex;
    gap:8px;
}

.composer input{
    flex:1;
    min-width:0;
    border:1px solid #ddd;
    border-radius:20px;
    padding:12px 15px;
    outline:none;
}

.send{
    background:#128C7E;
    color:white;
    border-radius:20px;
    padding:0 18px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0007;
    z-index:100;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:min(400px,90%);
    background:white;
    padding:25px;
    border-radius:15px;
}

.modal-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin:10px 0;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.error{
    color:#d00;
    min-height:20px;
}

@media(max-width:700px){

    .header{
        height:55px;
    }

    .app{
        height:calc(100vh - 55px);
    }

    .sidebar{
        width:100%;
    }

    .main{
        display:none;
    }

    .app.chat-open .sidebar{
        display:none;
    }

    .app.chat-open .main{
        display:flex;
        width:100%;
    }

    .back{
        display:block;
    }

    .message{
        max-width:85%;
    }

}

</style>

</head>

<body>

<div class="header">
💬 MyChat
</div>


<!-- LOGIN -->

<div id="loginBox" class="login">

<h2>MyChat</h2>

<input
id="username"
placeholder="Username"
autocomplete="username">

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password">

<div>

<button
class="primary"
onclick="register()">
Register
</button>

<button
class="primary"
onclick="login()">
Login
</button>

</div>

<p id="status"></p>

</div>


<!-- APP -->

<div id="app" class="app">


<div class="sidebar">

<div class="sidebar-header">

<b>Chats</b>

<button
class="new-chat"
onclick="showNewChat()">
＋ New Chat
</button>

</div>

<div
id="chatList"
class="chat-list">

<div class="empty">
No chats yet.
<br><br>
Use <b>＋ New Chat</b>
to start.
</div>

</div>

</div>


<div class="main">

<div class="chat-header">

<button
class="back"
onclick="backToChats()">
‹
</button>

<div>

<div class="current-name">
<span id="currentUser">
Select a chat
</span>
</div>

<span
id="typing"
class="typing">
</span>

</div>

</div>


<div
id="messages"
class="messages">
</div>


<div class="composer">

<input
id="text"
placeholder="Message..."
oninput="typingChanged()"
onkeydown="messageKey(event)">

<button
class="send"
onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>


<!-- NEW CHAT MODAL -->

<div
id="newModal"
class="modal">

<div class="modal-box">

<h3>New Chat</h3>

<input
id="newUsername"
placeholder="Enter username"
onkeydown="newChatKey(event)">

<p
id="newError"
class="error">
</p>

<div class="modal-actions">

<button
class="secondary"
onclick="hideNewChat()">
Cancel
</button>

<button
class="primary"
onclick="startNewChat()">
Start Chat
</button>

</div>

</div>

</div>


<script>

let ws;

let myUsername = "";

let currentUser = "";

let typingTimer = null;


/* CONNECTION */

function connect(){

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
    );


    ws.onopen = function(){

        document.getElementById(
            "status"
        ).textContent =
            "Connected";

    };


    ws.onmessage = function(event){

        let data;

        try{
            data =
                JSON.parse(event.data);
        }
        catch{
            return;
        }


        /* REGISTER */

        if(data.type === "register"){

            document.getElementById(
                "status"
            ).textContent =
                data.message;

        }


        /* LOGIN */

        if(data.type === "login"){

            if(data.success){

                myUsername =
                    data.username;

                document.getElementById(
                    "loginBox"
                ).style.display =
                    "none";

                document.getElementById(
                    "app"
                ).style.display =
                    "flex";

            }
            else{

                document.getElementById(
                    "status"
                ).textContent =
                    data.message;

            }

        }


        /* CHAT LIST */

        if(data.type === "chat_list"){

            renderChats(
                data.chats
            );

        }


        /* NEW CHAT */

        if(data.type === "new_chat"){

            if(data.success){

                hideNewChat();

                openChat(
                    data.username
                );

            }
            else{

                document.getElementById(
                    "newError"
                ).textContent =
                    data.message;

            }

        }


        /* HISTORY */

        if(data.type === "history"){

            renderHistory(
                data.messages
            );

        }


        /* MESSAGE */

        if(data.type === "message"){

            addMessage(data);

            if(
                data.sender === currentUser
            ){

                markSeen(
                    currentUser
                );

            }

        }


        /* SEEN */

        if(data.type === "seen"){

            document
                .querySelectorAll(
                    ".mine .message-status"
                )
                .forEach(
                    function(el){

                        el.textContent =
                            "✓✓ Seen";

                        el.classList.add(
                            "seen"
                        );

                    }
                );

        }


        /* TYPING */

        if(data.type === "typing"){

            if(
                data.username === currentUser
            ){

                document.getElementById(
                    "typing"
                ).textContent =
                    data.typing
                    ? "typing..."
                    : "";

            }

        }


        /* MESSAGE DELETE FOR ME */

        if(
            data.type === "message_deleted"
        ){

            const el =
                document.querySelector(
                    '[data-id="' +
                    data.id +
                    '"]'
                );

            if(el){
                el.remove();
            }

        }


        /* MESSAGE DELETE BOTH */

        if(
            data.type ===
            "message_deleted_both"
        ){

            const el =
                document.querySelector(
                    '[data-id="' +
                    data.id +
                    '"]'
                );

            if(el){

                el.innerHTML =
                    "<i>Message deleted</i>";

            }

        }


        /* CHAT DELETE */

        if(
            data.type === "chat_deleted"
        ){

            if(
                currentUser ===
                data.username
            ){

                currentUser = "";

                document.getElementById(
                    "currentUser"
                ).textContent =
                    "Select a chat";

                document.getElementById(
                    "messages"
                ).innerHTML = "";

                document.getElementById(
                    "typing"
                ).textContent = "";

                document.getElementById(
                    "app"
                ).classList.remove(
                    "chat-open"
                );

            }

        }


        if(data.type === "error"){

            alert(
                data.message
            );

        }

    };


    ws.onclose = function(){

        document.getElementById(
            "status"
        ).textContent =
            "Disconnected. Reconnecting...";

        setTimeout(
            connect,
            3000
        );

    };

}


/* REGISTER */

function register(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(
        !username ||
        !password
    ){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;

    }


    ws.send(
        JSON.stringify({

            action:
                "register",

            username:
                username,

            password:
                password

        })
    );

}


/* LOGIN */

function login(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(
        !username ||
        !password
    ){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;

    }


    ws.send(
        JSON.stringify({

            action:
                "login",

            username:
                username,

            password:
                password

        })
    );

}


/* CHAT LIST */

function renderChats(chats){

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";


    if(
        chats.length === 0
    ){

        list.innerHTML =
            "<div class='empty'>" +
            "No chats yet.<br><br>" +
            "Use <b>＋ New Chat</b> to start." +
            "</div>";

        return;

    }


    chats.forEach(
        function(chat){

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "chat-item";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "chat-info";


            info.innerHTML =
                "<div class='chat-name'>" +
                escapeHtml(
                    chat.username
                ) +
                "</div>" +

                "<span class='" +
                (
                    chat.online
                    ? "online"
                    : "offline"
                ) +
                "'>" +

                (
                    chat.online
                    ? "● Online"
                    : "● Offline"
                ) +

                "</span>";


            info.onclick =
                function(){

                    openChat(
                        chat.username
                    );

                };


            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "chat-delete";

            del.textContent =
                "🗑";


            del.onclick =
                function(event){

                    event.stopPropagation();

                    deleteChat(
                        chat.username
                    );

                };


            row.appendChild(info);

            row.appendChild(del);

            list.appendChild(row);

        }
    );

}


/* NEW CHAT */

function showNewChat(){

    document.getElementById(
        "newModal"
    ).style.display =
        "flex";

    document.getElementById(
        "newUsername"
    ).value = "";

    document.getElementById(
        "newError"
    ).textContent = "";

}


function hideNewChat(){

    document.getElementById(
        "newModal"
    ).style.display =
        "none";

}


function startNewChat(){

    const username =
        document.getElementById(
            "newUsername"
        ).value.trim();


    if(!username){

        document.getElementById(
            "newError"
        ).textContent =
            "Username required";

        return;

    }


    ws.send(
        JSON.stringify({

            action:
                "new_chat",

            username:
                username

        })
    );

}


function newChatKey(event){

    if(
        event.key === "Enter"
    ){

        startNewChat();

    }

}


/* OPEN CHAT */

function openChat(username){

    currentUser =
        username;


    document.getElementById(
        "currentUser"
    ).textContent =
        username;


    document.getElementById(
        "typing"
    ).textContent = "";


    document.getElementById(
        "messages"
    ).innerHTML = "";


    document.getElementById(
        "app"
    ).classList.add(
        "chat-open"
    );


    ws.send(
        JSON.stringify({

            action:
                "history",

            username:
                username

        })
    );


    setTimeout(
        function(){

            markSeen(
                username
            );

        },
        300
    );

}


/* HISTORY */

function renderHistory(messages){

    const box =
        document.getElementById(
            "messages"
        );

    box.innerHTML = "";


    messages.forEach(
        function(message){

            addMessage(
                message
            );

        }
    );


    scrollMessages();

}


/* ADD MESSAGE */

function addMessage(data){

    if(
        data.sender !==
            currentUser &&
        data.receiver !==
            currentUser
    ){

        return;

    }


    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message";


    div.setAttribute(
        "data-id",
        data.id
    );


    if(
        data.sender ===
        myUsername
    ){

        div.classList.add(
            "mine"
        );

    }


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-text";

    body.textContent =
        data.message;


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            data.time
        );


    div.appendChild(
        body
    );

    div.appendChild(
        time
    );


    if(
        data.sender ===
        myUsername
    ){

        const status =
            document.createElement(
                "div"
            );

        status.className =
            "message-status";

        status.textContent =
            data.seen
            ? "✓✓ Seen"
            : "✓ Sent";


        if(data.seen){

            status.classList.add(
                "seen"
            );

        }


        div.appendChild(
            status
        );

    }


    const menu =
        document.createElement(
            "div"
        );

    menu.className =
        "message-menu";


    const deleteMe =
        document.createElement(
            "button"
        );

    deleteMe.textContent =
        "Delete for me";

    deleteMe.onclick =
        function(){

            deleteForMe(
                data.id
            );

        };


    menu.appendChild(
        deleteMe
    );


    if(
        data.sender ===
        myUsername
    ){

        const deleteBoth =
            document.createElement(
                "button"
            );

        deleteBoth.className =
            "danger";

        deleteBoth.textContent =
            "Delete for both";

        deleteBoth.onclick =
            function(){

                deleteForBoth(
                    data.id
                );

            };


        menu.appendChild(
            deleteBoth
        );

    }


    div.appendChild(
        menu
    );


    document.getElementById(
        "messages"
    ).appendChild(
        div
    );


    scrollMessages();

}


/* SEND */

function sendMessage(){

    if(!currentUser){

        alert(
            "पहले chat select करें"
        );

        return;

    }


    const input =
        document.getElementById(
            "text"
        );

    const text =
        input.value.trim();


    if(!text)
        return;


    stopTyping();


    ws.send(
        JSON.stringify({

            action:
                "message",

            receiver:
                currentUser,

            message:
                text

        })
    );


    input.value = "";

    input.focus();

}


/* TYPING */

function typingChanged(){

    if(!currentUser)
        return;


    ws.send(
        JSON.stringify({

            action:
                "typing",

            receiver:
                currentUser,

            typing:
                true

        })
    );


    clearTimeout(
        typingTimer
    );


    typingTimer =
        setTimeout(
            stopTyping,
            1200
        );

}


function stopTyping(){

    if(
        !currentUser ||
        !ws
    )
        return;


    ws.send(
        JSON.stringify({

            action:
                "typing",

            receiver:
                currentUser,

            typing:
                false

        })
    );

}


/* SEEN */

function markSeen(username){

    if(!username)
        return;


    ws.send(
        JSON.stringify({

            action:
                "seen",

            username:
                username

        })
    );

}


/* DELETE MESSAGE FOR ME */

function deleteForMe(id){

    if(
        !confirm(
            "Delete this message for you?"
        )
    )
        return;


    ws.send(
        JSON.stringify({

            action:
                "delete_for_me",

            id:
                id

        })
    );

}


/* DELETE MESSAGE FOR BOTH */

function deleteForBoth(id){

    if(
        !confirm(
            "Delete this message for both users?"
        )
    )
        return;


    ws.send(
        JSON.stringify({

            action:
                "delete_for_both",

            id:
                id

        })
    );

}


/* DELETE CHAT */

function deleteChat(username){

    if(
        !confirm(
            "Delete entire chat for both users?"
        )
    )
        return;


    ws.send(
        JSON.stringify({

            action:
                "delete_chat",

            username:
                username

        })
    );

}


/* BACK */

function backToChats(){

    document.getElementById(
        "app"
    ).classList.remove(
        "chat-open"
    );

}


/* ENTER */

function messageKey(event){

    if(
        event.key === "Enter"
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* TIME */

function formatTime(value){

    if(!value)
        return "";

    const d =
        new Date(
            value.replace(
                " ",
                "T"
            ) +
            "Z"
        );


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "";

    }


    return d.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* SCROLL */

function scrollMessages(){

    const box =
        document.getElementById(
            "messages"
        );

    box.scrollTop =
        box.scrollHeight;

}


/* SECURITY */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* START */

connect();

</script>

</body>
</html>
