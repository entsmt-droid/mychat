<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>My Chat</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.header{
    background:#128C7E;
    color:white;
    padding:16px;
    font-size:22px;
    font-weight:bold;
}

.box{
    padding:20px;
    text-align:center;
}

input{
    padding:12px;
    margin:6px;
    border:1px solid #ccc;
    border-radius:20px;
}

button{
    padding:11px 17px;
    border:0;
    border-radius:20px;
    background:#128C7E;
    color:white;
}

#chat{
    display:none;
}

.topbar{
    background:white;
    padding:10px;
    text-align:right;
    border-bottom:1px solid #ddd;
}

.layout{
    display:flex;
    height:calc(100vh - 105px);
}

.users{
    width:35%;
    background:white;
    border-right:1px solid #ddd;
    overflow-y:auto;
}

.chat{
    width:65%;
    display:flex;
    flex-direction:column;
}

.chat-user{
    padding:15px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.chat-user:hover{
    background:#f5f5f5;
}

.online{
    color:#16a34a;
    font-size:12px;
}

.offline{
    color:#999;
    font-size:12px;
}

.chat-title{
    background:white;
    padding:14px;
    border-bottom:1px solid #ddd;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.message{
    background:white;
    padding:9px;
    margin:7px;
    border-radius:10px;
}

.mine{
    background:#dcf8c6;
    text-align:right;
}

.seen{
    color:#128C7E;
    font-size:11px;
}

.bottom{
    display:flex;
    padding:8px;
    background:white;
}

#text{
    flex:1;
    margin:0 5px 0 0;
    min-width:0;
}

#newChatBox{
    display:none;
    padding:10px;
    background:white;
    border-bottom:1px solid #ddd;
}

#newUsername{
    width:65%;
}

</style>

</head>

<body>


<div class="header">
💬 My Chat
</div>


<!-- LOGIN -->

<div id="login" class="box">

<h3>My Chat Account</h3>

<input
id="username"
placeholder="Username"
>

<br>

<input
id="password"
type="password"
placeholder="Password"
>

<br>

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

<p id="status"></p>

</div>


<!-- CHAT -->

<div id="chat">

<div class="topbar">

<button onclick="showNewChat()">
➕ New Chat
</button>

</div>


<div id="newChatBox">

<input
id="newUsername"
placeholder="Username"
>

<button onclick="startNewChat()">
Start Chat
</button>

<button onclick="hideNewChat()">
Cancel
</button>

<p id="newStatus"></p>

</div>


<div class="layout">


<!-- PRIVATE CHAT LIST -->

<div class="users">

<div class="box">

<b>Chats</b>

</div>

<div id="chatList"></div>

</div>


<!-- CHAT AREA -->

<div class="chat">

<div class="chat-title">

Chat with:
<b id="currentUser">
Select a chat
</b>

</div>


<div id="messages"></div>


<div class="bottom">

<input
id="text"
placeholder="Message..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>


</div>

</div>


<script>

let ws;

let myUsername = "";

let currentUser = "";


function connect(){

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
    );


    ws.onopen = function(){

        document.getElementById(
            "status"
        ).textContent =
            "Connected";

    };


    ws.onmessage = function(event){

        const data =
            JSON.parse(event.data);


        // REGISTER
        if(data.type === "register"){

            document.getElementById(
                "status"
            ).textContent =
                data.message;

        }


        // LOGIN
        if(data.type === "login"){

            if(data.success){

                myUsername =
                    data.username;

                document.getElementById(
                    "login"
                ).style.display =
                    "none";

                document.getElementById(
                    "chat"
                ).style.display =
                    "block";

            }else{

                document.getElementById(
                    "status"
                ).textContent =
                    data.message;

            }

        }


        // PRIVATE CHAT LIST
        if(data.type === "chat_list"){

            showChatList(
                data.chats
            );

        }


        // NEW CHAT
        if(data.type === "new_chat"){

            if(data.success){

                hideNewChat();

                openChat(
                    data.username
                );

            }else{

                document.getElementById(
                    "newStatus"
                ).textContent =
                    data.message;

            }

        }


        // HISTORY
        if(data.type === "history"){

            showHistory(
                data.messages
            );

            markSeen(
                data.username
            );

        }


        // MESSAGE
        if(data.type === "message"){

            addMessage(
                data
            );

            // अगर receiver अभी इसी chat में है
            if(
                data.sender === currentUser
            ){

                markSeen(
                    currentUser
                );

            }

        }


        // SEEN
        if(data.type === "seen"){

            document.querySelectorAll(
                ".mine .seen"
            ).forEach(function(el){

                el.textContent =
                    "✓✓ Seen";

            });

        }


        // ERROR
        if(data.type === "error"){

            alert(
                data.message
            );

        }

    };


    ws.onclose = function(){

        document.getElementById(
            "status"
        ).textContent =
            "Disconnected";

    };

}


function register(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!username || !password){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;

    }


    ws.send(
        JSON.stringify({

            action:"register",

            username:username,

            password:password

        })
    );

}


function login(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!username || !password){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;

    }


    ws.send(
        JSON.stringify({

            action:"login",

            username:username,

            password:password

        })
    );

}


function showChatList(chats){

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";


    if(chats.length === 0){

        list.innerHTML =
            "<div class='box'>" +
            "No chats yet.<br><br>" +
            "Tap ➕ New Chat to start." +
            "</div>";

        return;

    }


    chats.forEach(function(chat){

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "chat-user";


        div.innerHTML =
            "<b>" +
            escapeHtml(
                chat.username
            ) +
            "</b><br>" +

            "<span class='" +
            (
                chat.online
                ? "online"
                : "offline"
            ) +
            "'>" +

            (
                chat.online
                ? "● Online"
                : "● Offline"
            ) +

            "</span>";


        div.onclick =
            function(){

                openChat(
                    chat.username
                );

            };


        list.appendChild(div);

    });

}


function showNewChat(){

    document.getElementById(
        "newChatBox"
    ).style.display =
        "block";

    document.getElementById(
        "newUsername"
    ).focus();

}


function hideNewChat(){

    document.getElementById(
        "newChatBox"
    ).style.display =
        "none";

    document.getElementById(
        "newUsername"
    ).value = "";

    document.getElementById(
        "newStatus"
    ).textContent = "";

}


function startNewChat(){

    const username =
        document.getElementById(
            "newUsername"
        ).value.trim();


    if(!username){

        document.getElementById(
            "newStatus"
        ).textContent =
            "Username डालो";

        return;

    }


    ws.send(
        JSON.stringify({

            action:"new_chat",

            username:username

        })
    );

}


function openChat(username){

    currentUser =
        username;


    document.getElementById(
        "currentUser"
    ).textContent =
        username;


    document.getElementById(
        "messages"
    ).innerHTML = "";


    ws.send(
        JSON.stringify({

            action:"history",

            username:username

        })
    );

}


function showHistory(messages){

    document.getElementById(
        "messages"
    ).innerHTML = "";


    messages.forEach(function(msg){

        addMessage(
            msg
        );

    });


    scrollMessages();

}


function addMessage(data){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if(
        data.sender === myUsername
    ){

        div.classList.add(
            "mine"
        );

    }


    let status = "";


    if(
        data.sender === myUsername
    ){

        status =
            data.seen
            ? "✓✓ Seen"
            : "✓ Sent";

    }


    div.innerHTML =
        "<div>" +
        escapeHtml(
            data.sender
        ) +
        ": " +
        escapeHtml(
            data.message
        ) +
        "</div>" +

        "<div class='seen'>" +
        status +
        "</div>";


    document.getElementById(
        "messages"
    ).appendChild(div);


    scrollMessages();

}


function scrollMessages(){

    const box =
        document.getElementById(
            "messages"
        );

    box.scrollTop =
        box.scrollHeight;

}


function markSeen(username){

    if(!username)
        return;


    ws.send(
        JSON.stringify({

            action:"seen",

            username:username

        })
    );

}


function sendMessage(){

    if(!currentUser){

        alert(
            "पहले New Chat से user चुनें"
        );

        return;

    }


    const text =
        document.getElementById(
            "text"
        ).value.trim();


    if(!text)
        return;


    ws.send(
        JSON.stringify({

            action:"message",

            receiver:currentUser,

            message:text

        })
    );


    document.getElementById(
        "text"
    ).value = "";

}


function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


connect();

</script>

</body>

</html>
