<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>My Chat</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
}

.header{
    height:60px;
    background:#128C7E;
    color:white;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:22px;
    font-weight:bold;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    background:#128C7E;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

input{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    outline:none;
}

.login{
    max-width:400px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 2px 12px #0001;
    text-align:center;
}

.login input{
    width:100%;
    margin:7px 0;
}

.login button{
    margin:8px 4px;
}

#status{
    min-height:20px;
}

.app{
    display:none;
    width:100%;
    height:calc(100vh - 60px);
}

.sidebar{
    width:330px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.sidebar-top{
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
}

.chat-list{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.chat-item:hover{
    background:#f5f5f5;
}

.chat-name{
    flex:1;
}

.status-online{
    color:#16a34a;
    font-size:12px;
}

.status-offline{
    color:#999;
    font-size:12px;
}

.delete-btn{
    background:#dc3545;
    padding:7px 9px;
    font-size:13px;
}

.empty{
    padding:30px 15px;
    text-align:center;
    color:#777;
}

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:60px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.chat-header-name{
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    max-width:70%;
    margin:7px 0;
    padding:9px 12px;
    border-radius:10px;
    background:white;
    word-wrap:break-word;
    box-shadow:0 1px 2px #0001;
}

.mine{
    margin-left:auto;
    background:#dcf8c6;
}

.message-user{
    font-size:11px;
    color:#777;
    margin-bottom:3px;
}

.message-status{
    text-align:right;
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.seen{
    color:#128C7E;
}

.composer{
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
}

.composer input{
    flex:1;
    min-width:0;
}

.new-chat{
    display:none;
    position:fixed;
    inset:0;
    background:#0006;
    z-index:20;
    align-items:center;
    justify-content:center;
}

.new-box{
    width:min(90%,400px);
    background:white;
    padding:25px;
    border-radius:15px;
}

.new-box input{
    width:100%;
    margin:10px 0;
}

.new-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

.error{
    color:#d00;
    min-height:20px;
}

.mobile-back{
    display:none;
}

@media(max-width:700px){

    .header{
        height:55px;
        font-size:20px;
    }

    .app{
        height:calc(100vh - 55px);
    }

    .sidebar{
        width:100%;
    }

    .main{
        display:none;
        width:100%;
    }

    .app.mobile-chat .sidebar{
        display:none;
    }

    .app.mobile-chat .main{
        display:flex;
    }

    .mobile-back{
        display:block;
        background:none;
        color:#128C7E;
        padding:5px 10px 5px 0;
        font-size:22px;
    }

    .message{
        max-width:85%;
    }

}

</style>

</head>

<body>

<div class="header">
💬 My Chat
</div>


<!-- LOGIN -->

<div id="loginBox" class="login">

<h2>My Chat</h2>

<input
id="username"
placeholder="Username"
autocomplete="username"
>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<div>

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

</div>

<p id="status"></p>

</div>


<!-- APP -->

<div id="app" class="app">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="sidebar-top">

<b>Chats</b>

<button onclick="showNewChat()">
＋ New Chat
</button>

</div>

<div id="chatList" class="chat-list">

<div class="empty">
No chats yet.<br><br>
Press <b>＋ New Chat</b> to start.
</div>

</div>

</div>


<!-- MAIN CHAT -->

<div class="main">

<div class="chat-header">

<button
class="mobile-back"
onclick="backToChats()"
>
‹
</button>

<div class="chat-header-name">
Chat with:
<span id="currentUser">
Select a chat
</span>
</div>

</div>

<div
id="messages"
class="messages"
></div>

<div class="composer">

<input
id="text"
placeholder="Message..."
onkeydown="messageKey(event)"
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>


<!-- NEW CHAT -->

<div
id="newChat"
class="new-chat"
>

<div class="new-box">

<h3>New Chat</h3>

<input
id="newUsername"
placeholder="Enter username"
onkeydown="newChatKey(event)"
>

<p
id="newStatus"
class="error"
></p>

<div class="new-actions">

<button
onclick="hideNewChat()"
>
Cancel
</button>

<button
onclick="startNewChat()"
>
Start Chat
</button>

</div>

</div>

</div>


<script>

let ws = null;

let myUsername = "";

let currentUser = "";


function connect(){

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
    );


    ws.onopen = function(){

        document.getElementById(
            "status"
        ).textContent = "Connected";

    };


    ws.onmessage = function(event){

        let data;

        try{
            data = JSON.parse(event.data);
        }catch{
            return;
        }


        if(data.type === "register"){

            document.getElementById(
                "status"
            ).textContent =
                data.message;

        }


        if(data.type === "login"){

            if(data.success){

                myUsername =
                    data.username;

                document.getElementById(
                    "loginBox"
                ).style.display =
                    "none";

                document.getElementById(
                    "app"
                ).style.display =
                    "flex";

            }else{

                document.getElementById(
                    "status"
                ).textContent =
                    data.message;

            }

        }


        if(data.type === "chat_list"){

            renderChats(data.chats);

        }


        if(data.type === "new_chat"){

            if(data.success){

                hideNewChat();

                openChat(
                    data.username
                );

            }else{

                document.getElementById(
                    "newStatus"
                ).textContent =
                    data.message;

            }

        }


        if(data.type === "history"){

            renderHistory(
                data.messages
            );

        }


        if(data.type === "message"){

            addMessage(data);

            if(
                data.sender === currentUser
            ){

                markSeen(currentUser);

            }

        }


        if(data.type === "seen"){

            document.querySelectorAll(
                ".mine .message-status"
            ).forEach(function(el){

                el.textContent = "✓✓ Seen";

                el.classList.add("seen");

            });

        }


        if(data.type === "chat_deleted"){

            if(
                currentUser === data.username
            ){

                currentUser = "";

                document.getElementById(
                    "currentUser"
                ).textContent =
                    "Select a chat";

                document.getElementById(
                    "messages"
                ).innerHTML = "";

                document.getElementById(
                    "app"
                ).classList.remove(
                    "mobile-chat"
                );

            }

        }


        if(data.type === "error"){

            alert(data.message);

        }

    };


    ws.onclose = function(){

        document.getElementById(
            "status"
        ).textContent =
            "Disconnected from server";

    };

}


function register(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!username || !password){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;
    }


    ws.send(JSON.stringify({

        action:"register",

        username:username,

        password:password

    }));

}


function login(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!username || !password){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;
    }


    ws.send(JSON.stringify({

        action:"login",

        username:username,

        password:password

    }));

}


function renderChats(chats){

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";


    if(chats.length === 0){

        list.innerHTML =
            "<div class='empty'>" +
            "No chats yet.<br><br>" +
            "Press <b>＋ New Chat</b> to start." +
            "</div>";

        return;
    }


    chats.forEach(function(chat){

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "chat-item";


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "chat-name";

        name.innerHTML =
            "<b>" +
            escapeHtml(
                chat.username
            ) +
            "</b><br>" +

            "<span class='" +
            (
                chat.online
                ? "status-online"
                : "status-offline"
            ) +
            "'>" +

            (
                chat.online
                ? "● Online"
                : "● Offline"
            ) +

            "</span>";


        name.onclick =
            function(){

                openChat(
                    chat.username
                );

            };


        const del =
            document.createElement(
                "button"
            );

        del.className =
            "delete-btn";

        del.textContent =
            "🗑";

        del.onclick =
            function(event){

                event.stopPropagation();

                deleteChat(
                    chat.username
                );

            };


        row.appendChild(name);
        row.appendChild(del);

        list.appendChild(row);

    });

}


function showNewChat(){

    document.getElementById(
        "newChat"
    ).style.display =
        "flex";

    document.getElementById(
        "newUsername"
    ).value = "";

    document.getElementById(
        "newStatus"
    ).textContent = "";

    setTimeout(function(){

        document.getElementById(
            "newUsername"
        ).focus();

    },50);

}


function hideNewChat(){

    document.getElementById(
        "newChat"
    ).style.display =
        "none";

}


function startNewChat(){

    const username =
        document.getElementById(
            "newUsername"
        ).value.trim();


    if(!username){

        document.getElementById(
            "newStatus"
        ).textContent =
            "Username डालें";

        return;

    }


    ws.send(JSON.stringify({

        action:"new_chat",

        username:username

    }));

}


function openChat(username){

    currentUser =
        username;


    document.getElementById(
        "currentUser"
    ).textContent =
        username;


    document.getElementById(
        "messages"
    ).innerHTML = "";


    document.getElementById(
        "app"
    ).classList.add(
        "mobile-chat"
    );


    ws.send(JSON.stringify({

        action:"history",

        username:username

    }));


    setTimeout(function(){

        markSeen(username);

    },300);

}


function renderHistory(messages){

    const box =
        document.getElementById(
            "messages"
        );

    box.innerHTML = "";


    messages.forEach(function(msg){

        addMessage(
            msg
        );

    });


    scrollMessages();

}


function addMessage(data){

    if(
        data.sender !== currentUser &&
        data.receiver !== currentUser
    ){

        return;

    }


    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message";


    if(
        data.sender === myUsername
    ){

        div.classList.add(
            "mine"
        );

    }


    const user =
        document.createElement(
            "div"
        );

    user.className =
        "message-user";

    user.textContent =
        data.sender;


    const body =
        document.createElement(
            "div"
        );

    body.textContent =
        data.message;


    const status =
        document.createElement(
            "div"
        );

    status.className =
        "message-status";


    if(
        data.sender === myUsername
    ){

        status.textContent =
            data.seen
            ? "✓✓ Seen"
            : "✓ Sent";

        if(data.seen){

            status.classList.add(
                "seen"
            );

        }

    }


    div.appendChild(user);
    div.appendChild(body);
    div.appendChild(status);


    document.getElementById(
        "messages"
    ).appendChild(div);


    scrollMessages();

}


function sendMessage(){

    if(!currentUser){

        alert(
            "पहले New Chat से chat शुरू करें"
        );

        return;

    }


    const input =
        document.getElementById(
            "text"
        );

    const text =
        input.value.trim();


    if(!text)
        return;


    ws.send(JSON.stringify({

        action:"message",

        receiver:currentUser,

        message:text

    }));


    input.value = "";

    input.focus();

}


function markSeen(username){

    if(!username || !ws)
        return;


    ws.send(JSON.stringify({

        action:"seen",

        username:username

    }));

}


function deleteChat(username){

    const ok =
        confirm(
            "Delete this chat for both users?"
        );


    if(!ok)
        return;


    ws.send(JSON.stringify({

        action:"delete_chat",

        username:username

    }));

}


function backToChats(){

    document.getElementById(
        "app"
    ).classList.remove(
        "mobile-chat"
    );

}


function messageKey(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}


function newChatKey(event){

    if(event.key === "Enter"){

        event.preventDefault();

        startNewChat();

    }

}


function scrollMessages(){

    const box =
        document.getElementById(
            "messages"
        );

    box.scrollTop =
        box.scrollHeight;

}


function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


connect();

</script>

</body>

</html>
