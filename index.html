<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>My Chat</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.header{
    background:#128C7E;
    color:white;
    padding:16px;
    font-size:22px;
    font-weight:bold;
}

.box{
    padding:20px;
    text-align:center;
}

input{
    padding:12px;
    margin:6px;
    border:1px solid #ccc;
    border-radius:20px;
}

button{
    padding:11px 17px;
    border:0;
    border-radius:20px;
    background:#128C7E;
    color:white;
}

#chat{
    display:none;
}

.layout{
    display:flex;
    height:calc(100vh - 58px);
}

.users{
    width:35%;
    background:white;
    border-right:1px solid #ddd;
    overflow-y:auto;
}

.user{
    padding:15px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.user:hover{
    background:#f5f5f5;
}

.online{
    color:#16a34a;
    font-size:12px;
}

.offline{
    color:#999;
    font-size:12px;
}

.chatbox{
    width:65%;
    position:relative;
    display:flex;
    flex-direction:column;
}

.chat-title{
    padding:12px;
    background:white;
    border-bottom:1px solid #ddd;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.message{
    background:white;
    padding:9px;
    margin:7px;
    border-radius:10px;
}

.mine{
    background:#dcf8c6;
    text-align:right;
}

.seen{
    color:#128C7E;
    font-size:11px;
}

.bottom{
    display:flex;
    padding:8px;
    background:white;
}

#text{
    flex:1;
    margin:0 5px 0 0;
}

</style>

</head>

<body>

<div class="header">
💬 My Chat
</div>


<div id="login" class="box">

<h3>My Chat Account</h3>

<input
id="username"
placeholder="Username"
>

<br>

<input
id="password"
type="password"
placeholder="Password"
>

<br>

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

<p id="status"></p>

</div>


<div id="chat">

<div class="layout">


<div class="users">

<div class="box">

<b>Users</b>

</div>

<div id="userList"></div>

</div>


<div class="chatbox">

<div class="chat-title">

Chat with:
<b id="currentUser">
Select user
</b>

</div>

<div id="messages"></div>

<div class="bottom">

<input
id="text"
placeholder="Message..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>


</div>

</div>


<script>

let ws;

let myUsername = "";

let currentUser = "";


function connect(){

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
    );


    ws.onopen = function(){

        document.getElementById(
            "status"
        ).textContent =
            "Connected";

    };


    ws.onmessage = function(event){

        const data =
            JSON.parse(event.data);


        if(data.type === "register"){

            document.getElementById(
                "status"
            ).textContent =
                data.message;

        }


        if(data.type === "login"){

            if(data.success){

                myUsername =
                    data.username;

                document.getElementById(
                    "login"
                ).style.display =
                    "none";

                document.getElementById(
                    "chat"
                ).style.display =
                    "block";

            }else{

                document.getElementById(
                    "status"
                ).textContent =
                    data.message;

            }

        }


        if(data.type === "users"){

            showUsers(data.users);

        }


        if(data.type === "history"){

            showHistory(data.messages);

            markSeen(data.username);

        }


        if(data.type === "message"){

            addMessage(
                data
            );

        }


        if(data.type === "seen"){

            document.querySelectorAll(
                ".message[data-sender='" +
                myUsername +
                "'] .seen"
            ).forEach(function(el){

                el.textContent =
                    "✓✓ Seen";

            });

        }

    };


    ws.onclose = function(){

        document.getElementById(
            "status"
        ).textContent =
            "Disconnected";

    };

}


function register(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!username || !password){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;

    }


    ws.send(
        JSON.stringify({

            action:"register",

            username:username,

            password:password

        })
    );

}


function login(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(!username || !password){

        document.getElementById(
            "status"
        ).textContent =
            "Username and password required";

        return;

    }


    ws.send(
        JSON.stringify({

            action:"login",

            username:username,

            password:password

        })
    );

}


function showUsers(users){

    const list =
        document.getElementById(
            "userList"
        );

    list.innerHTML = "";


    users.forEach(function(user){

        if(user.username === myUsername)
            return;


        const div =
            document.createElement(
                "div"
            );

        div.className =
            "user";


        div.innerHTML =
            "<b>" +
            user.username +
            "</b><br>" +

            "<span class='" +
            (user.online
                ? "online"
                : "offline") +
            "'>" +

            (user.online
                ? "● Online"
                : "● Offline") +

            "</span>";


        div.onclick = function(){

            openChat(
                user.username
            );

        };


        list.appendChild(div);

    });

}


function openChat(username){

    currentUser =
        username;

    document.getElementById(
        "currentUser"
    ).textContent =
        username;


    document.getElementById(
        "messages"
    ).innerHTML = "";


    ws.send(
        JSON.stringify({

            action:"history",

            username:username

        })
    );

}


function showHistory(messages){

    document.getElementById(
        "messages"
    ).innerHTML = "";


    messages.forEach(function(msg){

        addMessage(msg);

    });

}


function addMessage(data){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if(data.sender === myUsername){

        div.classList.add(
            "mine"
        );

        div.dataset.sender =
            myUsername;

    }


    let seenText = "";


    if(data.sender === myUsername){

        seenText =
            data.seen
            ? "✓✓ Seen"
            : "✓ Sent";

    }


    div.innerHTML =
        "<div>" +
        escapeHtml(
            data.sender
        ) +
        ": " +
        escapeHtml(
            data.message
        ) +
        "</div>" +

        "<div class='seen'>" +
        seenText +
        "</div>";


    document.getElementById(
        "messages"
    ).appendChild(div);


    const box =
        document.getElementById(
            "messages"
        );

    box.scrollTop =
        box.scrollHeight;


    if(
        data.sender === currentUser &&
        data.receiver === myUsername
    ){

        markSeen(
            currentUser
        );

    }

}


function markSeen(username){

    if(!username)
        return;


    ws.send(
        JSON.stringify({

            action:"seen",

            username:username

        })
    );

}


function sendMessage(){

    if(!currentUser){

        alert(
            "First select a user"
        );

        return;

    }


    const text =
        document.getElementById(
            "text"
        ).value.trim();


    if(!text)
        return;


    ws.send(
        JSON.stringify({

            action:"message",

            receiver:currentUser,

            message:text

        })
    );


    document.getElementById(
        "text"
    ).value = "";

}


function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


connect();

</script>

</body>

</html>
